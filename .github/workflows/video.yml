name: Hacer video

on:
  push:
    branches: [main]
    paths: ['episodios/**', 'voz/**']
  workflow_dispatch:
    inputs:
      episodio:
        description: 'Nombre del episodio (ej. lapicero)'
        required: true

permissions:
  contents: write

concurrency:
  group: video
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Instalar ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow numpy
      - name: Renderizar
        env:
          EPISODIO: ${{ github.event.inputs.episodio }}
        run: python3 render_cambios.py
      - name: Guardar el video en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videos guiones
          git diff --cached --quiet || git commit -m "Video listo [skip ci]"
          git pull --rebase -q && git push
